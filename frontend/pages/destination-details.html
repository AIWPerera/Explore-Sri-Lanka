
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Destination Details | Explore Sri Lanka</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/destination-details.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="site-header">
        <nav class="details-navbar">
            <a href="../index.html" class="details-logo">
                Explore Sri Lanka
            </a>

            <div class="details-nav-links">
                <a href="../index.html">Home</a>
                <a href="about.html">About</a>
                <a href="destinations.html">Destinations</a>
            </div>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="details-hero" id="detailsHero">
        <div class="details-hero-content">
            <span>EXPLORE SRI LANKA</span>
            <h1 id="destinationTitle">Destination</h1>
            <p id="destinationLocation">Sri Lanka</p>
        </div>
    </section>

    <main class="details-container">

        <a href="destinations.html" class="back-link">
            ← Back to Destinations
        </a>

        <!-- Introduction -->
        <section class="details-intro">
            <div class="details-description">
                <span class="section-label">DISCOVER</span>
                <h2 id="destinationHeading">About This Destination</h2>
                <p id="destinationDescription"></p>
            </div>

            <div class="details-image">
                <img id="destinationImage" src="" alt="Destination">
            </div>
        </section>

        <!-- Highlights -->
        <section class="details-highlights">
            <div class="section-heading">
                <span class="section-label">EXPLORE MORE</span>
                <h2>Top Highlights</h2>
            </div>

            <div class="highlights-grid" id="highlightsGrid">
            </div>
        </section>

        <!-- Travel Information -->
        <section class="travel-info">
            <h2>Travel Information</h2>

            <div class="travel-info-grid">
                <div class="info-card">
                    <h3>Best Time to Visit</h3>
                    <p id="bestTime"></p>
                </div>

                <div class="info-card">
                    <h3>Recommended Duration</h3>
                    <p id="duration"></p>
                </div>

                <div class="info-card">
                    <h3>Location</h3>
                    <p id="travelLocation"></p>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="details-footer">
        <p>&copy; 2026 Explore Sri Lanka. All rights reserved.</p>
    </footer>

    <script src="../js/destination-details.js"></script>
</body>
</html>
